<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>逆流鹅上</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#B8D8E8;overflow:hidden;touch-action:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#gameCanvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
"use strict";
try{

var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
var W=400,H=750,BANK=40,RL=BANK,RR=W-BANK,RW=RR-RL;
var scale=1;
var FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif';

function rRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

function resize(){
  var ww=window.innerWidth,wh=window.innerHeight,a=W/H;
  var cw,ch;
  if(ww/wh<a){cw=ww;ch=ww/a}else{ch=wh;cw=wh*a}
  canvas.width=cw;canvas.height=ch;scale=cw/W;
  canvas.style.marginTop=((wh-ch)/2)+'px';
}
window.addEventListener('resize',resize);resize();

// =====================================================
// SVG Sprites — 用 SVG 矢量路径画精细角色
// 然后转成 Image 对象供 Canvas 使用
// =====================================================
function svgToImg(svg,w,h,cb){
  var img=new Image();
  img.onload=function(){cb(img);};
  img.src='data:image/svg+xml,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'">'+svg+'</svg>'
  );
}

var sprGoose,sprShark,sprCroc,sprStump,sprRock;
var loadCount=0,totalLoad=5;

function onSprLoad(){
  loadCount++;
  if(loadCount>=totalLoad) requestAnimationFrame(loop);
}

// ===== PARTICLES =====
var particles=[];
function emitP(x,y,type,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var sp=type==='death'?1.5+Math.random()*3:0.2+Math.random()*0.4;
    particles.push({x:x,y:y,
      vx:type==='bubble'?(Math.random()-0.5)*0.3:Math.cos(a)*sp,
      vy:type==='bubble'?-0.2-Math.random()*0.3:Math.sin(a)*sp,
      r:type==='death'?2+Math.random()*3:1.5+Math.random()*1.5,
      life:1,decay:type==='death'?0.02:0.008,type:type,
      color:type==='death'?['#ffa0a0','#ffdd88','#ffbb88','#fff'][i%4]:'#fff'
    });
  }
}
function updPart(){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.type!=='bubble')p.vy+=0.02;if(p.life<=0)particles.splice(i,1);}}
function drawPart(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];ctx.globalAlpha=p.life*0.5;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

var selectedSkin=parseInt(localStorage.getItem('gooseSelectedSkin'))||(-1);
var seenSkinScore=parseInt(localStorage.getItem('gooseSeenSkinScore'))||0;

function gp(e){var t=e.touches?e.touches[0]:e,r=canvas.getBoundingClientRect();return{x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale};}
function hStart(e){if(e.preventDefault)e.preventDefault();var p=gp(e);
  if(state==='menu'){
    var gooseY=H*0.24,gooseH=105,gooseW=140;
    if(p.x>W/2-gooseW/2&&p.x<W/2+gooseW/2&&p.y>gooseY&&p.y<gooseY+gooseH){state='skins';seenSkinScore=highScore;localStorage.setItem('gooseSeenSkinScore',seenSkinScore);return;}
    if(p.y>H*0.78-26&&p.y<H*0.78+26&&p.x>W/2-85&&p.x<W/2+85){startGame();return;}
    return;}
  if(state==='skins'){handleSkinTap(p);return;}
  if(state==='over'){
    if(p.y>H*0.58&&p.y<H*0.58+46){
      if(p.x>W/2-95&&p.x<W/2-5){state='menu';return;}
      if(p.x>W/2+5&&p.x<W/2+95){startGame();return;}
    }return;}
  touchX0=p.x;touchY0=p.y;gooseX0=goose.x;gooseY0=goose.y;dragging=true;}
function hMove(e){if(e.preventDefault)e.preventDefault();if(!dragging||state!=='playing')return;var p=gp(e);goose.x=Math.max(RL+goose.w/2,Math.min(RR-goose.w/2,gooseX0+(p.x-touchX0)));goose.y=Math.max(goose.h/2,Math.min(H-goose.h/2,gooseY0+(p.y-touchY0)));}
function hEnd(e){if(e.preventDefault)e.preventDefault();dragging=false;}
canvas.addEventListener('touchstart',hStart,{passive:false});
canvas.addEventListener('touchmove',hMove,{passive:false});
canvas.addEventListener('touchend',hEnd,{passive:false});
canvas.addEventListener('mousedown',hStart);canvas.addEventListener('mousemove',hMove);canvas.addEventListener('mouseup',hEnd);

for(var di=0;di<duckLevels.length;di++){(function(d){var img=new Image();img.onload=function(){d.img=img;};img.src=d.src;})(duckLevels[di]);}
function getDuckSprite(s){var sc=s!=null?s:score;for(var i=duckLevels.length-1;i>=0;i--){if(sc>=duckLevels[i].score&&duckLevels[i].img)return duckLevels[i].img;}return sprGoose;}
function getSelectedSprite(){if(selectedSkin>=0&&selectedSkin<duckLevels.length&&duckLevels[selectedSkin].img&&highScore>=duckLevels[selectedSkin].score)return duckLevels[selectedSkin].img;return sprGoose;}
function getSpr(t){
  if(t==='shark')return sprShark;
  if(t==='croc')return sprCroc;
  if(t==='stump')return sprStump;
  return sprRock;
}
function spawnOb(){
  var n=Math.random()<0.3?2:1,used=[];
  for(var i=0;i<n;i++){
    var info=OBS[Math.floor(Math.random()*OBS.length)];
    var x,tries=0;
    do{x=RL+info.w/2+Math.random()*(RW-info.w);tries++;}while(tries<20&&used.some(function(px){return Math.abs(px-x)<60;}));
    if(n===2&&used.length>0&&!gapOk(used,x,info.w))continue;
    used.push(x);
    var isSwimmer=info.type==='shark'||info.type==='croc';
    obstacles.push({x:x,y:-info.h,w:info.w,h:info.h,type:info.type,sw:info.sw,sh:info.sh,
      wb:Math.random()*Math.PI*2,
      swimAmp:isSwimmer?15+Math.random()*20:0,
      swimSpd:isSwimmer?0.02+Math.random()*0.015:0,
      baseX:x});
  }
}
function gapOk(pos,nx,nw){
  var all=[];for(var i=0;i<pos.length;i++)all.push({x:pos[i],w:50});all.push({x:nx,w:nw});
  all.sort(function(a,b){return(a.x-a.w/2)-(b.x-b.w/2);});
  var le=RL;for(var j=0;j<all.length;j++){if((all[j].x-all[j].w/2)-le>=goose.w+14)return true;le=Math.max(le,all[j].x+all[j].w/2);}
  return(RR-le)>=goose.w+14;
}

function drawWater(){
  ctx.fillStyle='#B8D8E8';ctx.fillRect(RL,0,RW,H);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.2;ctx.lineCap='round';
  var sY=fc*0.8;
  for(var ly=0;ly<2;ly++){
    var sp=[65,90][ly],amp=[2.5,3.5][ly],spd=[0.8,0.5][ly];
    for(var y=-sp+((sY*spd)%sp);y<H;y+=sp){
      ctx.beginPath();
      for(var x=RL+8;x<=RR-8;x+=6){
        var yy=y+Math.sin((x+fc*spd*0.5)*0.03+ly)*amp;
        if(x===RL+8)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
  }
  // 水面光斑
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(var si=0;si<6;si++){
    var sx=RL+20+((si*67+fc*0.3)%(RW-40));
    var sy=((si*113+fc*0.15)%H);
    ctx.beginPath();ctx.arc(sx,sy,2+Math.sin(fc*0.02+si)*1,0,Math.PI*2);ctx.fill();
  }
}

function drawBanks(){
  for(var side=0;side<2;side++){
    var bx=side===0?0:RR;
    ctx.fillStyle='#7EAE6E';ctx.fillRect(bx,0,BANK,H);
    ctx.fillStyle='#6D9E5E';
    var sY=fc*0.3;
    for(var y=-8;y<H+8;y+=14){
      for(var x=4;x<BANK-4;x+=10){
        var gx=bx+x;var gy=((y+sY*0.15)%(H+20))-10;
        ctx.beginPath();
        ctx.moveTo(gx,gy+4);
        ctx.quadraticCurveTo(gx-2,gy+1,gx,gy-3);
        ctx.quadraticCurveTo(gx+2,gy+1,gx+1,gy+4);
        ctx.fill();
      }
    }
  }
}

function drawGoose(x,y){
  var bob=Math.sin(fc*0.07)*2.5;goose.bob=bob;
  var selSpr=getSelectedSprite();
  var scoreSpr=getDuckSprite(score);
  var selIdx=selectedSkin,scoreIdx=-1;
  for(var i=duckLevels.length-1;i>=0;i--){if(score>=duckLevels[i].score&&duckLevels[i].img){scoreIdx=i;break;}}
  var spr=(scoreIdx>selIdx)?scoreSpr:selSpr;
  if(!spr)return;
  var sw=80,sh=80;
  if(spr===sprGoose){sh=60;}
  goose.w=sw;goose.h=sh;
  if(shield){
    var sr=Math.max(sw,sh)*0.75;
    var pulse=1+Math.sin(fc*0.08)*0.05;
    ctx.save();ctx.translate(x,y+bob);
    ctx.globalAlpha=0.18+Math.sin(fc*0.06)*0.06;
    ctx.fillStyle='#7ED8F7';
    ctx.beginPath();ctx.arc(0,0,sr*pulse,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.45+Math.sin(fc*0.06)*0.1;
    ctx.strokeStyle='#5EC4E8';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,sr*pulse,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.3;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-sr*0.3,-sr*0.3,sr*0.12,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  ctx.drawImage(spr,x-sw/2,y-sh/2+bob,sw,sh);
}

function drawBubbleItems(){
  for(var bi=0;bi<bubbleItems.length;bi++){
    var b=bubbleItems[bi];
    var pulse=1+Math.sin(fc*0.05+bi)*0.1;
    ctx.save();ctx.translate(b.x,b.y);
    ctx.globalAlpha=0.25;ctx.fillStyle='#7ED8F7';
    ctx.beginPath();ctx.arc(0,0,b.r*pulse,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.6;ctx.strokeStyle='#5EC4E8';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,b.r*pulse,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.5;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-b.r*0.3,-b.r*0.35,b.r*0.22,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawBtn(x,y,w2,h2,text){
  ctx.fillStyle='rgba(80,140,110,0.15)';
  ctx.beginPath();rRect(ctx,x+2,y+3,w2,h2,h2/2);ctx.fill();
  ctx.fillStyle='#7ECAA0';
  ctx.beginPath();rRect(ctx,x,y,w2,h2,h2/2);ctx.fill();
  var fs=w2<120?15:20;
  ctx.fillStyle='#fff';ctx.font='bold '+fs+'px '+FONT;ctx.textAlign='center';
  ctx.fillText(text,x+w2/2,y+h2/2+(fs<18?5:7));
}
function drawCard(x,y,w2,h2,r){
  // 柔和阴影
  ctx.fillStyle='rgba(120,150,170,0.08)';
  ctx.beginPath();rRect(ctx,x+2,y+3,w2,h2,r);ctx.fill();
  // 卡片
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.beginPath();rRect(ctx,x,y,w2,h2,r);ctx.fill();
}

}

var skinNames=['初始','一级','二级','三级','四级','五级','六级'];
var skinScores=[0,20,35,45,60,75,90];

function handleSkinTap(p){
  // Back button
  if(p.x>20&&p.x<70&&p.y>20&&p.y<50){state='menu';return;}
  // Skin grid
  var cols=3,pad=14,cardW=80,cardH=100;
  var totalW=cols*cardW+(cols-1)*pad;
  var sx0=W/2-totalW/2;
  var sy0=H*0.18;
  for(var i=0;i<7;i++){
    var col=i%cols,row=Math.floor(i/cols);
    var cx=sx0+col*(cardW+pad),cy=sy0+row*(cardH+pad+6);
    if(p.x>=cx&&p.x<=cx+cardW&&p.y>=cy&&p.y<=cy+cardH){
      var unlocked=(i===0)||(highScore>=skinScores[i]);
      if(unlocked){
        selectedSkin=i-1;
        localStorage.setItem('gooseSelectedSkin',selectedSkin);
      }
      return;
    }
  }
}

function drawSkins(){
  drawWater();drawBanks();
  ctx.fillStyle='rgba(184,216,232,0.3)';ctx.fillRect(0,0,W,H);

  // Back button
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath();rRect(ctx,20,18,50,30,12);ctx.fill();
  ctx.fillStyle='#778';ctx.font='bold 14px '+FONT;ctx.textAlign='center';
  ctx.fillText('\u2190',45,38);

  // Title
  ctx.fillStyle='#5AAA78';ctx.font='900 22px '+FONT;ctx.textAlign='center';
  ctx.fillText('皮肤图鉴',W/2,46);

  var cols=3,pad=14,cardW=80,cardH=100;
  var totalW=cols*cardW+(cols-1)*pad;
  var sx0=W/2-totalW/2;
  var sy0=H*0.18;

  for(var i=0;i<7;i++){
    var col=i%cols,row=Math.floor(i/cols);
    var cx=sx0+col*(cardW+pad),cy=sy0+row*(cardH+pad+6);
    var unlocked=(i===0)||(highScore>=skinScores[i]);
    var isSelected=(i===0&&selectedSkin===-1)||(i>0&&selectedSkin===i-1);

    // Card bg
    if(isSelected){
      ctx.fillStyle='rgba(126,202,160,0.25)';
      ctx.beginPath();rRect(ctx,cx-3,cy-3,cardW+6,cardH+6,16);ctx.fill();
      ctx.strokeStyle='#7ECAA0';ctx.lineWidth=2.5;
      ctx.beginPath();rRect(ctx,cx-3,cy-3,cardW+6,cardH+6,16);ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();rRect(ctx,cx,cy,cardW,cardH,12);ctx.fill();

    // Sprite
    var spr=(i===0)?sprGoose:(duckLevels[i-1].img);
    var imgS=54;
    var imgY=cy+8;
    if(unlocked){
      if(spr){ctx.drawImage(spr,cx+(cardW-imgS)/2,imgY,imgS,imgS);}
    }else{
      ctx.fillStyle='rgba(200,210,220,0.3)';
      ctx.beginPath();rRect(ctx,cx+(cardW-imgS)/2,imgY,imgS,imgS,10);ctx.fill();
      ctx.fillStyle='rgba(100,120,140,0.5)';ctx.font='bold 32px '+FONT;ctx.textAlign='center';
      ctx.fillText('?',cx+cardW/2,imgY+imgS/2+12);
    }

    // Label
    ctx.textAlign='center';
    if(!unlocked){
      ctx.fillStyle='#bbb';ctx.font='400 10px '+FONT;
      ctx.fillText(skinScores[i]+'分解锁',cx+cardW/2,cy+cardH-8);
    }

    // Selected checkmark
    if(isSelected&&unlocked){
      ctx.fillStyle='#7ECAA0';ctx.font='bold 11px '+FONT;
      ctx.fillText('\u2714 使用中',cx+cardW/2,cy+cardH-8);
    }
  }

  // Hint
  ctx.fillStyle='rgba(90,120,110,0.4)';ctx.font='400 12px '+FONT;ctx.textAlign='center';
  ctx.fillText('点击已解锁皮肤即可装备',W/2,H*0.92);
}

function drawGameOver(){
  overAlpha=Math.min(1,overAlpha+0.04);
  ctx.fillStyle='rgba(184,216,232,'+(overAlpha*0.45)+')';ctx.fillRect(0,0,W,H);
  var cy=H*0.22;
  drawCard(W/2-120,cy,240,220,20);
  ctx.textAlign='center';
  ctx.fillStyle='#E88070';ctx.font='900 28px '+FONT;
  ctx.fillText('游戏结束',W/2,cy+66);
  ctx.fillStyle='#e0ddd8';ctx.fillRect(W/2-50,cy+78,100,1);
  ctx.fillStyle='#aab';ctx.font='400 13px '+FONT;
  ctx.fillText('本次得分',W/2,cy+102);
  ctx.fillStyle='#556';ctx.font='900 42px '+FONT;
  ctx.fillText(''+score,W/2,cy+150);
  if(score>=highScore&&score>0){
    ctx.fillStyle='#E8A050';ctx.font='bold 14px '+FONT;
    ctx.fillText('NEW RECORD!',W/2,cy+182);
  }else{
    ctx.fillStyle='#bbc';ctx.font='400 13px '+FONT;
    ctx.fillText('最高分 '+highScore,W/2,cy+182);
  }
  drawBtn(W/2-95,H*0.58,90,46,'返回首页');
  drawBtn(W/2+5,H*0.58,90,46,'再来一次');
}

function checkHit(ob){
  var s=12;
  return goose.x-goose.w/2+s<ob.x+ob.w/2-s&&goose.x+goose.w/2-s>ob.x-ob.w/2+s&&
    goose.y-goose.h/2+goose.bob+s<ob.y+ob.h/2-s&&goose.y+goose.h/2+goose.bob-s>ob.y-ob.h/2+s;
}

var lt=0,st=0;
function update(ts){
  var dt=lt?(ts-lt):16;lt=ts;updPart();
  if(state!=='playing')return;
  gameTime+=dt;st+=dt;if(st>=1000){score++;st-=1000;}
  var lv=Math.floor(gameTime/4000);
  obstSpeed=1.8+lv*0.14+lv*lv*0.008;
  spawnInt=Math.max(520,1600-lv*50-lv*lv*2.5);
  if(keys['ArrowLeft']||keys['a'])goose.x=Math.max(RL+goose.w/2,goose.x-5);
  if(keys['ArrowRight']||keys['d'])goose.x=Math.min(RR-goose.w/2,goose.x+5);
  if(keys['ArrowUp']||keys['w'])goose.y=Math.max(goose.h/2,goose.y-5);
  if(keys['ArrowDown']||keys['s'])goose.y=Math.min(H-goose.h/2,goose.y+5);
  if(gameTime-lastSpawn>spawnInt){spawnOb();lastSpawn=gameTime;}
  // 气泡道具生成
  if(gameTime-lastBubbleSpawn>bubbleSpawnInt&&!shield){
    bubbleItems.push({x:RL+30+Math.random()*(RW-60),y:-20,r:16});
    lastBubbleSpawn=gameTime;
    bubbleSpawnInt=8000+Math.random()*6000;
  }
  if(fc%16===0)emitP(goose.x+(Math.random()-0.5)*10,goose.y+20,'bubble',1);
  if(shieldTimer>0)shieldTimer-=dt;
  if(shieldTimer<=0)shield=false;
  shakeX*=0.85;shakeY*=0.85;
  // 气泡道具拾取
  for(var bi=bubbleItems.length-1;bi>=0;bi--){
    var b=bubbleItems[bi];b.y+=obstSpeed*0.6;
    if(b.y>H+30){bubbleItems.splice(bi,1);continue;}
    var dx=goose.x-b.x,dy=(goose.y+goose.bob)-b.y;
    if(Math.sqrt(dx*dx+dy*dy)<b.r+goose.w/3){
      shield=true;shieldTimer=15000;
      emitP(b.x,b.y,'bubble',8);
      bubbleItems.splice(bi,1);
    }
  }
  for(var i=obstacles.length-1;i>=0;i--){
    var ob=obstacles[i];
    ob.y+=obstSpeed;
    if(ob.swimAmp){
      ob.x=ob.baseX+Math.sin(fc*ob.swimSpd+ob.wb)*ob.swimAmp;
      ob.x=Math.max(RL+ob.w/2,Math.min(RR-ob.w/2,ob.x));
    }
    if(ob.y>H+60){obstacles.splice(i,1);continue;}
    if(checkHit(ob)){
      if(shield){
        shield=false;shieldTimer=0;
        shakeX=(Math.random()-0.5)*5;shakeY=(Math.random()-0.5)*3;
        emitP(goose.x,goose.y,'death',10);
        obstacles.splice(i,1);
        continue;
      }
      state='over';hitFlash=20;
      shakeX=(Math.random()-0.5)*10;shakeY=(Math.random()-0.5)*6;
      emitP(goose.x,goose.y,'death',16);
      if(score>highScore){highScore=score;localStorage.setItem('gooseHighScore',highScore);}
      return;
    }
  }
}

function draw(){
  ctx.save();ctx.scale(scale,scale);ctx.translate(shakeX,shakeY);
  ctx.fillStyle='#B8D8E8';ctx.fillRect(-10,-10,W+20,H+20);
  if(state==='menu'){drawMenu();}
  else if(state==='skins'){drawSkins();}
  else{
    drawWater();drawBanks();
    for(var oi=0;oi<obstacles.length;oi++){
      var ob=obstacles[oi];
      var sway=Math.sin(fc*0.04+ob.wb)*1.5;
      var isSwimmer=ob.type==='shark'||ob.type==='croc';
      var bodyRot=isSwimmer?Math.sin(fc*0.06+ob.wb)*0.12:sway*0.01;
      var spr=getSpr(ob.type);
      if(spr){
        ctx.save();ctx.translate(ob.x,ob.y);ctx.rotate(bodyRot);
        ctx.drawImage(spr,-ob.sw/2,-ob.sh/2,ob.sw,ob.sh);
        ctx.restore();
      }
    }
    drawBubbleItems();
    drawPart();
    if(hitFlash>0){hitFlash--;if(hitFlash%4<2)drawGoose(goose.x,goose.y);}
    else drawGoose(goose.x,goose.y);
    drawHUD();
    if(state==='over')drawGameOver();
  }
  ctx.restore();
}

function loop(ts){fc++;update(ts);draw();requestAnimationFrame(loop);}

}catch(e){
  document.body.style.background='#fff';document.body.style.color='#c00';
  document.body.style.padding='20px';document.body.style.fontSize='16px';
  document.body.innerHTML='<h2>Error</h2><pre>'+e.message+'\n'+e.stack+'</pre>';
}
